stages:
  - build
  - test
  - package
  - smoketest
  - scan
  - deliver

default:
  tags:
    - SE140-2026

build:
  stage: build
  image: node:22
  script:
    - cd log-service
    - npm ci
  
  artifacts:
    paths:
      - log-service/node_modules/

test:
  stage: test
  image: node:22

  script:
    - cd log-service
    - npm test
  
  artifacts:
    paths:
      - log-service/reports

    reports:
      junit:
        - log-service/reports/junit.xml

package:
  stage: package
  image: quay.io/podman/stable

  script:
    - cd log-service
    - podman build -t log-service .
    - podman save -o image.tar log-service

  artifacts:
    paths:
      - log-service/image.tar

smoketest:
  stage: smoketest
  image: quay.io/podman/stable

  script:
    - podman load -i log-service/image.tar
    - podman run -d -p 3000:3000 localhost/log-service:latest
    - sleep 5
    - curl --fail http://localhost:3000/clear

scan:
  stage: scan
  image:
    name: aquasec/trivy
    entrypoint: [""]

  script:
    - trivy image --input log-service/image.tar --severity HIGH,CRITICAL --exit-code 1