stages:
  - build
  - test
  - package
  - smoketest
  - scan
  - deliver

default:
  tags:
    - SE140-2026

build:
  stage: build
  image: node:22
  script:
    - cd log-service
    - npm ci
  
  artifacts:
    paths:
      - log-service/node_modules/

test:
  stage: test
  image: node:22

  script:
    - cd log-service
    - npm test
  
  artifacts:
    paths:
      - log-service/reports

    reports:
      junit:
        - log-service/reports/junit.xml

package:
  stage: package
  image: quay.io/podman/stable

  script:
    - cd log-service
    - podman build -t log-service .
    - podman save -o image.tar log-service
    - ls -lh image.tar

  artifacts:
    paths:
      - log-service/image.tar