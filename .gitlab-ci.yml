stages:
  - build_package
  - deploy
  - clean

default:
  tags:
    - SE140-2026

build_api:
  stage: build_package
  image: quay.io/podman/stable

  script:
    - podman login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - podman build -t api-service ./api-service
    - podman tag api-service $CI_REGISTRY_IMAGE/api-service:$CI_COMMIT_SHORT_SHA
    - podman push $CI_REGISTRY_IMAGE/api-service:$CI_COMMIT_SHORT_SHA

  rules:
    - if: '$CI_COMMIT_MESSAGE !~ /\[CLEAN\]/'

build_log:
  stage: build_package
  image: quay.io/podman/stable

  script:
    - podman login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - podman build -t log-service ./log-service
    - podman tag log-service $CI_REGISTRY_IMAGE/log-service:$CI_COMMIT_SHORT_SHA
    - podman push $CI_REGISTRY_IMAGE/log-service:$CI_COMMIT_SHORT_SHA

  rules:
    - if: '$CI_COMMIT_MESSAGE !~ /\[CLEAN\]/'

build_blocklist:
  stage: build_package
  image: quay.io/podman/stable

  script:
    - podman login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - podman build -t blocklist-service ./blocklist-service
    - podman tag blocklist-service $CI_REGISTRY_IMAGE/blocklist-service:$CI_COMMIT_SHORT_SHA
    - podman push $CI_REGISTRY_IMAGE/blocklist-service:$CI_COMMIT_SHORT_SHA

  rules:
    - if: '$CI_COMMIT_MESSAGE !~ /\[CLEAN\]/'

deploy:
  stage: deploy

  image: python:3.12

  rules:
  - if: '$CI_COMMIT_MESSAGE =~ /\[DEPLOY\]/ && $CI_COMMIT_MESSAGE !~ /\[CLEAN\]/'


  before_script:
    - pip install ansible
    - pip install docker
    - ansible-galaxy collection install community.docker
    - mkdir -p ~/.ssh
    - echo "$DEPLOY_SSH_KEY" | base64 -d > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa

  script:
    - export ANSIBLE_HOST_KEY_CHECKING=False
    - >
      ansible-playbook -i ansible/inventory.ini ansible/deploy.yml
      -e "registry_url=$CI_REGISTRY"
      -e "registry_user=$CI_REGISTRY_USER"
      -e "registry_password=$CI_REGISTRY_PASSWORD"
      -e "registry_image=$CI_REGISTRY_IMAGE"
      -e "image_tag=$CI_COMMIT_SHORT_SHA"

clean:
  stage: clean

  image: python:3.12

  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /\[CLEAN\]/'

  before_script:
    - pip install ansible
    - mkdir -p ~/.ssh
    - echo "$DEPLOY_SSH_KEY" | base64 -d > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa

  script:
    - export ANSIBLE_HOST_KEY_CHECKING=False
    - ansible-playbook -i ansible/inventory.ini ansible/cleanup.yml
