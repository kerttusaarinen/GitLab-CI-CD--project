name: CI/CD Pipeline (Ex3)

on:
  push:
    branches: [ "ex3" ]
  pull_request:
    branches: [ "ex3" ]

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [api-service, log-service, blocklist-service]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker image
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG=ghcr.io/$REPO/${{ matrix.service }}:${{ github.sha }}
          
          cd ${{ matrix.service }}
          docker build -t ${{ matrix.service }} .
          docker tag ${{ matrix.service }}:latest $IMAGE_TAG
          docker push $IMAGE_TAG

  deploy:
    needs: build_and_push
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[DEPLOY]')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python and Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible docker
          ansible-galaxy collection install community.docker

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
      - name: Run Ansible Deploy Playbook
        env:
          CI_REGISTRY: "ghcr.io"
          CI_REGISTRY_USER: "${{ github.actor }}"
          CI_JOB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          CI_REGISTRY_IMAGE: "ghcr.io/${{ github.repository }}"
          CI_COMMIT_SHORT_SHA: "${{ github.sha }}"
        run: |
          export ANSIBLE_HOST_KEY_CHECKING=False
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          ansible-playbook -i ansible/inventory.ini ansible/deploy.yml \
            -e "registry_url=ghcr.io" \
            -e "registry_user=${{ github.actor }}" \
            -e "registry_password=${{ secrets.GITHUB_TOKEN }}" \
            -e "registry_image=ghcr.io/$REPO" \
            -e "image_tag=${{ github.sha }}"

  clean:
    needs: build_and_push
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[CLEAN]')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python and Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Run Ansible Cleanup Playbook
        run: |
          export ANSIBLE_HOST_KEY_CHECKING=False
          ansible-playbook -i ansible/inventory.ini ansible/cleanup.yml
